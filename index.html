<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gray Houser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #e00b00;
            --black: #000000;
            --white: #ffffff;
            --gray: #f5f5f5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            padding: 24px 0;
            border-bottom: 6px solid var(--black);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }

        /* Hero Section */
        .hero {
            padding: 80px 0;
            border-bottom: 6px solid var(--black);
        }

        .hero h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.95;
            margin-bottom: 24px;
        }

        .hero h1 .accent {
            color: var(--red);
        }

        .hero p {
            font-size: 1.25rem;
            font-weight: 400;
            max-width: 500px;
            color: #333;
        }

        /* Signup Section */
        .signup-section {
            padding: 80px 0;
            background-color: var(--black);
            color: var(--white);
        }

        .signup-section h2 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .signup-section .tagline {
            font-size: 1.125rem;
            margin-bottom: 48px;
            color: #ccc;
            max-width: 500px;
        }

        .signup-embed {
            background: var(--white);
            border-radius: 8px;
            padding: 24px;
            max-width: 600px;
        }

        /* Footer */
        footer {
            padding: 40px 0;
            border-top: 6px solid var(--black);
            text-align: center;
        }

        footer p {
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero {
                padding: 48px 0;
            }

            .signup-section {
                padding: 48px 0;
            }

            header {
                border-bottom-width: 4px;
            }

            footer {
                border-top-width: 4px;
            }

            .hero {
                border-bottom-width: 4px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Gray Houser</div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1>Writer.<br><span class="accent">Theme Park<br>Enthusiast.</span></h1>
            <p>I cover Disney, theme parks, and entertainment. Join thousands of readers getting the news that matters.</p>
        </div>
    </section>

    <section class="signup-section">
        <div class="container">
            <h2>Get Monorail News</h2>
            <p class="tagline">Unparalleled Disney, theme park, and entertainment news and analysis delivered to your inbox.</p>
            <div class="signup-embed">
                <div style="height: 40vmin;min-height: 360px"><script src="https://cdn.jsdelivr.net/ghost/signup-form@~0.3/umd/signup-form.min.js" data-label-1="grayhouser" data-background-color="#ffffff" data-text-color="#000000" data-button-color="#e00b00" data-button-text-color="#FFFFFF" data-title="Monorail News" data-description="Unparalleled Disney, theme park, and entertainment news and analysis." data-icon="https://monorailnews.com/content/images/size/w192h192/size/w256h256/2025/10/MN_Portrait_Red.jpg.webp" data-site="https://monorailnews.com/" data-locale="en" async></script></div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Gray Houser</p>
        </div>
    </footer>
</body>
</html>
