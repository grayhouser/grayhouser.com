<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gray Houser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #e00b00;
            --black: #000000;
            --white: #ffffff;
            --gray: #f5f5f5;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--white);
            color: var(--black);
            line-height: 1.5;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            padding: 24px 0;
            border-bottom: 6px solid var(--black);
            text-align: center;
            position: relative;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            display: inline-block;
        }

        /* Decorative elements */
        .decoration {
            position: absolute;
            pointer-events: none;
        }

        .circle {
            border: 6px solid var(--red);
            border-radius: 50%;
        }

        .square {
            border: 6px solid var(--black);
        }

        .filled-circle {
            background: var(--red);
            border-radius: 50%;
        }

        /* Hero Section */
        .hero {
            padding: 100px 0;
            border-bottom: 6px solid var(--black);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero .circle-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -100px;
        }

        .hero .circle-2 {
            width: 120px;
            height: 120px;
            bottom: 20px;
            right: -60px;
        }

        .hero .square-1 {
            width: 80px;
            height: 80px;
            top: 40px;
            right: 10%;
            transform: rotate(15deg);
        }

        .hero .filled-dot-1 {
            width: 24px;
            height: 24px;
            bottom: 30%;
            left: 8%;
        }

        .hero .filled-dot-2 {
            width: 16px;
            height: 16px;
            top: 20%;
            right: 20%;
        }

        .hero h1 {
            font-size: clamp(3rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: -0.04em;
            line-height: 0.95;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }

        .hero h1 .accent {
            color: var(--red);
            display: block;
        }

        .hero p {
            font-size: 1.35rem;
            font-weight: 400;
            max-width: 500px;
            margin: 0 auto;
            color: #333;
            position: relative;
            z-index: 1;
        }

        /* Divider */
        .divider {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 24px 0;
            background: var(--black);
        }

        .divider-dot {
            width: 12px;
            height: 12px;
            background: var(--red);
            border-radius: 50%;
        }

        .divider-line {
            width: 60px;
            height: 4px;
            background: var(--white);
        }

        /* Signup Section */
        .signup-section {
            padding: 100px 0;
            background-color: var(--black);
            color: var(--white);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .signup-section .circle-3 {
            width: 300px;
            height: 300px;
            bottom: -150px;
            left: -150px;
            border-color: rgba(224, 11, 0, 0.3);
        }

        .signup-section .square-2 {
            width: 100px;
            height: 100px;
            top: 10%;
            right: 5%;
            border-color: rgba(255, 255, 255, 0.2);
            transform: rotate(-10deg);
        }

        .signup-section h2 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .signup-section h2 .highlight {
            position: relative;
            display: inline-block;
        }

        .signup-section h2 .highlight::after {
            content: '';
            position: absolute;
            bottom: 0.1em;
            left: -0.05em;
            right: -0.05em;
            height: 0.3em;
            background: var(--red);
            z-index: -1;
        }

        .signup-section .tagline {
            font-size: 1.25rem;
            margin-bottom: 48px;
            color: #ccc;
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
            z-index: 1;
        }

        .signup-embed {
            background: var(--white);
            border-radius: 12px;
            padding: 32px;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--red);
            color: var(--white);
            padding: 8px 20px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background: var(--white);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Footer */
        footer {
            padding: 48px 0;
            border-top: 6px solid var(--black);
            text-align: center;
            position: relative;
        }

        .footer-shapes {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .footer-shape {
            width: 12px;
            height: 12px;
        }

        .footer-shape.red {
            background: var(--red);
        }

        .footer-shape.black {
            background: var(--black);
        }

        .footer-shape.outline {
            border: 3px solid var(--black);
            background: transparent;
        }

        footer p {
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .hero {
                padding: 64px 0;
            }

            .signup-section {
                padding: 64px 0;
            }

            header {
                border-bottom-width: 4px;
            }

            footer {
                border-top-width: 4px;
            }

            .hero {
                border-bottom-width: 4px;
            }

            .hero .square-1,
            .hero .circle-2 {
                display: none;
            }

            .signup-section .square-2 {
                display: none;
            }

            .signup-embed {
                padding: 20px;
                margin: 0 8px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">Gray Houser</div>
        </div>
    </header>

    <section class="hero">
        <div class="decoration circle circle-1"></div>
        <div class="decoration circle circle-2"></div>
        <div class="decoration square square-1"></div>
        <div class="decoration filled-circle filled-dot-1"></div>
        <div class="decoration filled-circle filled-dot-2"></div>
        <div class="container">
            <h1>Writer.<span class="accent">Theme Park Enthusiast.</span></h1>
            <p>I cover Disney, theme parks, and entertainment. Join thousands of readers getting the news that matters.</p>
        </div>
    </section>

    <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-dot"></div>
        <div class="divider-line"></div>
    </div>

    <section class="signup-section">
        <div class="decoration circle circle-3"></div>
        <div class="decoration square square-2"></div>
        <div class="container">
            <div class="badge">
                <span class="badge-dot"></span>
                Free Newsletter
            </div>
            <h2>Get <span class="highlight">Monorail News</span></h2>
            <p class="tagline">Unparalleled Disney, theme park, and entertainment news and analysis delivered to your inbox.</p>
            <div class="signup-embed">
                <div style="height: 40vmin;min-height: 360px"><script src="https://cdn.jsdelivr.net/ghost/signup-form@~0.3/umd/signup-form.min.js" data-label-1="grayhouser" data-background-color="#ffffff" data-text-color="#000000" data-button-color="#e00b00" data-button-text-color="#FFFFFF" data-title="Monorail News" data-description="Unparalleled Disney, theme park, and entertainment news and analysis." data-icon="https://monorailnews.com/content/images/size/w192h192/size/w256h256/2025/10/MN_Portrait_Red.jpg.webp" data-site="https://monorailnews.com/" data-locale="en" async></script></div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="footer-shapes">
                <div class="footer-shape red"></div>
                <div class="footer-shape black"></div>
                <div class="footer-shape outline"></div>
                <div class="footer-shape red"></div>
            </div>
            <p>&copy; 2025 Gray Houser</p>
        </div>
    </footer>
</body>
</html>
